# Battleshiple: nginx configuration for the site. Include this file from the http {} block (for
# example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify reads public/_headers and public/_redirects instead, Cloudflare Pages public/_headers,
# and Apache public/.htaccess. The three carry the same values; _headers says why each one is what
# it is. This file is for a site at the root of its own domain, which is what the README
# recommends. `listen ... ssl http2` is the form every nginx in a current distribution loads (the
# `http2 on;` directive is 1.25.1 and later; Ubuntu 24.04 ships 1.24 and Debian 12 1.22); from
# 1.25.1 `nginx -t` warns that the form is deprecated, and still loads it.

# The bundle carries a hash of its contents in its name, so it can be kept a year; everything
# else keeps its name from one deploy to the next and is revalidated on every load.
map $uri $battleshiple_cache_control {
  default            "no-cache";
  ~^/_expo/static/   "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  server_tokens off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com;

  # The folder `npm run build:web -- --host nginx` writes (dist-web/), copied here. Never a git
  # checkout: the locations below answer only the site's own paths, so a checkout published here
  # by mistake answers 404 for every file in it, but that is the second line, not the first.
  root /var/www/battleshiple;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  server_tokens off;
  autoindex off;
  charset utf-8;

  # A missing page, a refused path and a folder all answer the site's own not-found page.
  error_page 404 /404.html;
  error_page 403 =404 /404.html;

  # The site's own paths and nothing else: the page, the safety net, the stylesheet, the not-found
  # page, the favicon, robots.txt, security.txt and the bundle, and /api/, which goes to the API
  # (below). Everything else answers 404: the other hosts' configurations, metadata.json, any
  # dotfile, and every file of a repository.
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|404\.html|guard\.js|site\.css|favicon\.ico|robots\.txt|\.well-known/security\.txt|_expo/static/js/web/[A-Za-z0-9_-]+\.js)$ {
    try_files $uri =404;
  }
  location / {
    return 404;
  }
  # The website's sign-in and shop API (server/kit), on the site's own origin: `node
  # server/start.mjs` listening on 127.0.0.1:8788 (README, "Sign-in and the shop"). ^~ wins over
  # the regular expression above, so nothing under /api/ is served from the folder; proxy_pass has
  # no URI, so the path reaches the API unchanged. The API sends its own headers: the one
  # add_header here is what keeps the server block's from being sent beside them (a browser reads
  # the last of two Referrer-Policy values), and it repeats the server block's
  # Strict-Transport-Security line. What nginx answers here itself, the API not running (502) or
  # not answering in time (504), is the site's not-found page, which the regular expression above
  # serves with every header the server block sets; the status stays, and the page draws no
  # sign-in and no shop. nginx's own error page would go out with this location's one header
  # alone. The API's own answers, its errors included, pass through as it sent them. A site that
  # runs no API can delete this location: /api/ then answers 404 like any other path not the site's.
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    error_page 502 504 /404.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Set here, in the server block, and in no location but /api/ above: a location with an
  # add_header of its own inherits none of these.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), attribution-reporting=(), autoplay=(), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), join-ad-interest-group=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), private-aggregation=(), publickey-credentials-create=(), publickey-credentials-get=(), run-ad-auction=(), screen-wake-lock=(), serial=(), shared-storage=(), shared-storage-select-url=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $battleshiple_cache_control always;
}
